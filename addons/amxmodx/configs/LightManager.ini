#==============================================#
# Light Manager by RedSMURF: Configuration file #
#==============================================#

# To add a new light, follow the example below
# [Light Name]
# LIGHT_MODEL                       = Path to the light's model
# LIGHT_FLAGS                       = a - Show Model        b - Color Random        c - Active Delay        d - Active Duration

# LIGHT_COLOR_FREQUENCY             = Frequency in seconds at which the light's color changes randomly (only applicable if FLAG_COLOR_RANDOM is set)
# LIGHT_ACTIVE_DELAY                = Delay in seconds before the light turns on after being activated
# LIGHT_ACTIVE_DURATION             = Duration in seconds for which the light remains on after being activated
# LIGHT_ACTIVE_COOLDOWN             = Cooldown in seconds before the light can be activated again

# To make an light available in the menu, you must defined at least it's name like this [RedSMURF's Light]
# light model and sound cannot be changed dynamically during gameplay

[Main Settings]
SETTING_DEFAULT_MODEL               = models/LightManager/light.mdl
SETTING_DEFAULT_FLAGS               = 0

SETTING_DEFAULT_COLOR_FREQUENCY     = 1.0 1.0
SETTING_DEFAULT_ACTIVE_DELAY        = 0.0 0.0
SETTING_DEFAULT_ACTIVE_DURATION     = 20.0 30.0
SETTING_DEFAULT_ACTIVE_COOLDOWN     = 5.0 5.0

SETTING_LIGHT_LOAD                  = 1             # Whether to load saved lights data of the current map
SETTING_LIGHT_TASK                  = 0.1           # Time interval in seconds to check for lights and apply their effects
SETTING_LIGHT_LIFE                  = 2

[Default Light]

[Show Bulb]
LIGHT_FLAGS                         = a

[Color Changes]
LIGHT_FLAGS                         = b

[With Cooldown]
LIGHT_FLAGS                         = d
LIGHT_ACTIVE_DURATION               = 1.0 1.0
LIGHT_ACTIVE_COOLDOWN               = 0.5 0.5

